name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the Pillow that rendered the committed previews: a different
      # resampler or PNG encoder would rewrite them byte for byte. Bump this
      # when the previews are regenerated.
      - name: Install Pillow for the artwork scripts
        run: python3 -m pip install --upgrade "pillow==13.0.0"

      - name: Palettes and borders agree with colors.toml
        run: python3 design/check.py

      - name: Both TOML files parse and the design scripts compile
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          for name in ("colors.toml", "shell.toml"):
              tomllib.loads(Path(name).read_text())
              print(f"{name}: ok")
          PY
          python3 -m py_compile design/*.py

      # preview.png is a real screenshot, so it cannot be rebuilt here. The two
      # files the scripts own are rendered from the committed wordmark into a
      # temp directory and compared, which keeps them honest without needing
      # Omarchy installed on the runner.
      - name: Generated previews are current
        run: |
          mkdir -p "$RUNNER_TEMP/previews"
          python3 design/lock_preview.py --wordmark unlock.png --out "$RUNNER_TEMP/previews"
          cmp unlock.png "$RUNNER_TEMP/previews/unlock.png"
          cmp preview-unlock.png "$RUNNER_TEMP/previews/preview-unlock.png"
