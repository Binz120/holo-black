name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Palettes and borders agree with colors.toml
        run: python3 design/check.py
